<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Política de privacidad</title>
<meta name="description" content="Cómo se usan y protegen los datos personales en el sitio del acueducto.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<!-- Números más claros: Inter solo para los dígitos (las letras siguen con Atkinson Hyperlegible) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&text=0123456789" rel="stylesheet">
<style>
  :root{--papel:#F2F6F7;--blanco:#fff;--tinta:#15323B;--suave:#5B7078;--linea:#D5E0E3;--agua:#1D6FA3;--agua-claro:#E1EEF6}
  *{box-sizing:border-box}
  html{scroll-padding-top:20px}
  body{margin:0;font-family:"Inter","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta);background:var(--papel);line-height:1.6;font-size:16px}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  a{color:var(--agua)}
  header{background:var(--blanco);border-bottom:1px solid var(--linea)}
  header .dentro{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .gota{width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--agua);flex:none}
  header a.marca{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--tinta);font-weight:700}
  header a.volver{margin-left:auto;font-weight:700;text-decoration:none}
  main{max-width:820px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:30px;line-height:1.2;margin:0 0 6px}
  .fecha{color:var(--suave);margin:0 0 20px}
  .indice{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:14px 18px;margin-bottom:26px}
  .indice ol{margin:6px 0 0;padding-left:20px;columns:2;column-gap:28px}
  .indice li{break-inside:avoid;margin:2px 0}
  section{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:6px 22px 14px;margin-bottom:14px}
  h2{font-size:19px;margin:16px 0 6px}
  ul{padding-left:22px}
  li{margin:4px 0}
  .tabla{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
  .tabla th,.tabla td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
  .tabla th{background:var(--papel);font-size:13.5px;color:var(--suave)}
  .tabla-cont{overflow-x:auto}
  .nota{background:var(--agua-claro);border-radius:10px;padding:10px 14px;font-size:14.5px}
  @media (max-width:600px){ .indice ol{columns:1} h1{font-size:25px} section{padding:4px 16px 12px} }
</style>
</head>
<body>
<header><div class="dentro">
  <a class="marca" href="index.html"><span class="gota" aria-hidden="true"></span><span data-nombre>el acueducto</span></a>
  <a class="volver" href="index.html">← Volver</a>
</div></header>

<main>
  <h1>Política de privacidad</h1>
  <p class="fecha" id="fecha">Cargando…</p>
  <nav class="indice" aria-label="Contenido" id="indice" hidden><b>Contenido</b><ol id="indiceLista"></ol></nav>
  <div id="politica"></div>
  <p class="nota">Este texto es una guía general. La junta del acueducto debe revisarlo y ajustarlo a su situación, idealmente con asesoría legal.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/politica.js"></script>
<script src="assets/js/sitio.js" data-privacidad="privacidad.html"></script>
<script>
// La política se escribe en Configuración (administración). Si todavía no se ha escrito, se muestra el texto base.
(async function(){
  const pintar = (texto, datos, fecha) => {
    const r = window.AcuPolitica.render(texto || window.AcuPolitica.TEXTO_BASE, datos);
    document.getElementById('politica').innerHTML = r.html;
    document.getElementById('indiceLista').innerHTML = r.secciones.map(s => `<li><a href="#${s.id}">${s.titulo.replace(/[&<>"']/g, '')}</a></li>`).join('');
    document.getElementById('indice').hidden = !r.secciones.length;
    document.getElementById('fecha').textContent = fecha
      ? 'Última actualización: ' + new Date(fecha).toLocaleDateString('es', {day:'numeric', month:'long', year:'numeric'})
      : '';
    if (location.hash){ const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
  };
  try {
    const c = window.ACU_CONFIG;
    const sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY, {auth:{persistSession:false, autoRefreshToken:false}});
    const {data} = await sb.from('configuracion').select('nombre,correo_contacto,whatsapp,whatsapp_activo,politica_privacidad,politica_actualizada_en').eq('id', 1).maybeSingle();
    const d = data || {};
    if (d.nombre){ document.querySelectorAll('[data-nombre]').forEach(e => { e.textContent = d.nombre; }); document.title = 'Política de privacidad: ' + d.nombre; }
    const wa = d.whatsapp_activo && String(d.whatsapp || '').replace(/\D/g, '').length >= 8 ? d.whatsapp : '';
    pintar(d.politica_privacidad, {acueducto:d.nombre, correo:d.correo_contacto, whatsapp:wa}, d.politica_privacidad ? d.politica_actualizada_en : null);
  } catch (e){ console.warn(e); pintar('', {}, null); }
})();
</script>
</body>
</html>
